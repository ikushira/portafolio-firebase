<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
header{padding:40px;text-align:center}
h1{font-size:40px}

button{padding:10px;background:#00ff88;border:none;cursor:pointer}

</style>

<body>
<header>
<h1>👨‍💻 Luis Aldana</h1>
<p>Desarrollador Web Junior | JavaScript | Firebase</p>
</header>
<section>
<h2>🚀 Proyectos</h2>
<div class="card">
<h3>🛒 Tienda Online</h3>
<p>E-commerce completo con autenticación y base de datos</p>
<a href="#">Ver proyecto</a>
</div>
<div class="card">
<h3>📋 App de Tareas (CRUD Firebase)</h3>

<a href="#crud">Ver proyecto</a>
</div>

<!-- ========================= -->
<!-- CRUD APP FIREBASE        -->
<!-- ========================= -->
<section id="crud">
<h2>📋 App de Tareas</h2>
<input type="text" id="taskInput" placeholder="Nueva tarea">
<button onclick="addTask()">Agregar</button>
<ul id="taskList"></ul>
</section>

<script type="module">
// IMPORTAR FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// CONFIG (REEMPLAZA CON TU FIREBASE)
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_DOMINIO",
  projectId: "TU_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const taskList = document.getElementById("taskList");

async function loadTasks(){
  taskList.innerHTML="";
  const querySnapshot = await getDocs(collection(db, "tasks"));
  querySnapshot.forEach((docSnap)=>{
    const li = document.createElement("li");
    li.innerHTML = `${docSnap.data().text} 
    <button onclick="deleteTask('${docSnap.id}')">❌</button>
    <button onclick="editTask('${docSnap.id}','${docSnap.data().text}')">✏️</button>`;
    taskList.appendChild(li);
  });
}

window.addTask = async function(){
  const input = document.getElementById("taskInput");
  if(input.value.trim()==="") return;
  await addDoc(collection(db, "tasks"), { text: input.value });
  input.value="";
  loadTasks();
}

window.deleteTask = async function(id){
  await deleteDoc(doc(db, "tasks", id));
  loadTasks();
}

window.editTask = async function(id, text){
  const newText = prompt("Editar tarea", text);
  if(newText){
    await updateDoc(doc(db, "tasks", id), { text: newText });
    loadTasks();
  }
}

loadTasks();
</script>
</body>
</html>
