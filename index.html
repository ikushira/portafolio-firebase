async function loadTasks(){
  taskList.innerHTML="";
  const q = query(collection(db,"tasks"), where("uid","==",currentUser.uid));
  const snap = await getDocs(q);
  snap.forEach(docSnap=>{
    const li = document.createElement("li");
    li.innerHTML = `
      ${docSnap.data().text}
      <div>
        <button class="btn-warning" onclick="editTask('${docSnap.id}','${docSnap.data().text}')">✏️</button>
        <button class="btn-danger" onclick="deleteTask('${docSnap.id}')">❌</button>
      </div>`;
    taskList.appendChild(li);
  });
}

window.addTask = async ()=>{
  const input = document.getElementById("taskInput");
  if(!input.value.trim()) return;
  await addDoc(collection(db,"tasks"), {text:input.value, uid:currentUser.uid});
  input.value="";
  loadTasks();
}

window.deleteTask = async (id)=>{
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
}

window.editTask = async (id,text)=>{
  const newText = prompt("Editar tarea", text);
  if(newText){
    await updateDoc(doc(db,"tasks",id), {text:newText});
    loadTasks();
  }
}
